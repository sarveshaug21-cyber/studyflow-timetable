name: Deploy to GitHub Pages

# This workflow is triggered by a new push to master (not by re-running failed
# jobs) so each run starts with zero retained artifacts. Re-running a failed job
# would upload another artifact named "github-pages" while keeping the earlier
# one, causing deploy-pages to find multiple artifacts with the same name.
on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
